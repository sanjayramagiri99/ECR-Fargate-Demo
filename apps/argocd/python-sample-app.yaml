apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-sample
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sanjayramagiri99/ECR-Fargate-Demo.git
    targetRevision: main
    path: apps/python-sample

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true