apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-sample
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-sample

  template:
    metadata:
      labels:
        app: python-sample

    spec:
      containers:
        - name: python-sample

          image: 951488807529.dkr.ecr.us-east-1.amazonaws.com/fargate/python-sample:2.0

          ports:
            - containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 250m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: 8080

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3